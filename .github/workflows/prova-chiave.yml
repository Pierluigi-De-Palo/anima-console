# COSA FA — risponde a una domanda sola: «la chiave ANTHROPIC_API_KEY è al suo
#   posto e funziona?». Si lancia a mano dal bottone "Run workflow", non parte
#   mai da sola.
# PERCHÉ ESISTE — dal 16/08 l'automazione era ferma perché il secret mancava, e
#   l'unico modo di scoprirlo era aprire una richiesta vera e guardarla morire.
#   Un guasto che si misura solo rompendo qualcosa non si misura mai.
# FIN DOVE ARRIVA — dice se la chiave c'è e se autentica. NON dice se hai
#   credito residuo, e non produce verdetti.
# COSTO — zero token. La prova usa GET /v1/models, che richiede autenticazione
#   ma non genera niente: nessuna spesa, nemmeno un centesimo.
# SICUREZZA — il valore della chiave non viene MAI stampato. Si stampa solo la
#   lunghezza, che non permette di ricostruirla.
# — creato da D.R.A.G.O., 2026-08-30

name: Prova della chiave

on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: 1 · La chiave c'è, ed è di forma legale?
        env:
          CHIAVE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          # PERCHE QUESTO PASSO E' CRESCIUTO — incidente del 30/08, run #3.
          # Il secret c'era, ma il valore conteneva DUE a capo e una dozzina di
          # caratteri cirillici al posto dei latini (К per K, С per C, а per a...):
          # una chiave incollata da un testo passato per una conversione.
          # Conseguenze, in ordine di gravita':
          #  1. l'SDK non poteva nemmeno spedire la richiesta — un a capo dentro
          #     un'intestazione HTTP e' illegale (LocalProtocolError);
          #  2. e soprattutto: l'a capo ha ROTTO IL MASCHERAMENTO di GitHub, che
          #     nasconde il segreto riga per riga. Meta' chiave e' finita in chiaro
          #     nel log di un repository PUBBLICO.
          # Da qui la regola: la forma si controlla PRIMA di usare il valore, e il
          # controllo non stampa mai il valore — nemmeno un pezzo, nemmeno per aiutare.
          import os, sys, unicodedata

          k = os.environ.get("CHIAVE", "")
          if not k:
              print("✗ ANTHROPIC_API_KEY NON e' configurato in questo repo.")
              print("")
              print("  Dove si mette: Settings -> Secrets and variables -> Actions")
              print("  -> New repository secret -> nome esatto: ANTHROPIC_API_KEY")
              sys.exit(1)

          problemi = []

          righe = k.count("\n") + k.count("\r")
          if righe:
              problemi.append(f"contiene {righe} a capo")

          bordi = len(k) - len(k.strip())
          if bordi:
              problemi.append(f"ha {bordi} spazi ai bordi")

          fuori = [(i, c) for i, c in enumerate(k) if not (32 <= ord(c) <= 126)]
          if fuori:
              # Si nominano le POSIZIONI e i NOMI Unicode, mai i caratteri della chiave.
              elenco = ", ".join(
                  f"pos.{i+1} ({unicodedata.name(c, 'sconosciuto')})" for i, c in fuori[:6])
              piu = f" e altri {len(fuori)-6}" if len(fuori) > 6 else ""
              problemi.append(f"{len(fuori)} caratteri non-ASCII: {elenco}{piu}")

          if problemi:
              print("✗ LA CHIAVE E' MALFORMATA. Non la uso: la spedirei in chiaro nei log.")
              print("")
              for x in problemi:
                  print(f"  · {x}")
              print("")
              print("  Caratteri cirillici o accentati al posto dei latini vogliono dire")
              print("  che la chiave e' passata da una conversione di testo: ricopiata a")
              print("  mano, letta da un'immagine, o incollata da un documento formattato.")
              print("")
              print("  COSA FARE, in quest'ordine:")
              print("  1. REVOCA la chiave su console.anthropic.com: se un a capo era")
              print("     gia' finito in un log, il mascheramento di GitHub si e' rotto")
              print("     e parte del valore e' stata scritta in chiaro.")
              print("  2. Generane una nuova e copiala col bottone «Copy», mai a mano.")
              print("  3. Incollala nel secret senza premere Invio prima di salvare.")
              sys.exit(1)

          print(f"✓ Il secret c'e' ed e' di forma legale. Lunghezza: {len(k)} caratteri.")
          print("  Nessun a capo, nessuno spazio ai bordi, tutti caratteri ASCII stampabili.")
          print("  (il valore non viene stampato, e non deve esserlo mai)")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 2 · Installa la libreria
        run: pip install --quiet anthropic

      - name: 3 · La rete del runner arriva all'API?
        run: |
          # BERSAGLIO DI CONTROLLO — senza questo, un fallimento di rete non dice di
          # chi è la colpa. Il run #1 del 30/08 è morto con «non raggiungo l'API» e
          # nessuno poteva sapere se fosse l'API, il runner o il nostro codice.
          for host in https://api.github.com https://api.anthropic.com; do
            codice=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$host" 2>&1 || echo "000")
            echo "  $host → HTTP $codice"
          done
          echo "  (401 o 404 vanno benissimo: dicono che l'host risponde. 000 = non ci arrivo.)"

      - name: 4 · La chiave autentica davvero?
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import sys
          import anthropic

          # GET /v1/models: richiede autenticazione, non genera testo.
          # È la prova più economica possibile che la chiave sia valida —
          # zero token, quindi zero spesa.
          try:
              modelli = anthropic.Anthropic().models.list()
          except anthropic.AuthenticationError:
              print("✗ La chiave c'è ma NON è valida (401).")
              print("  Probabile: chiave revocata, scaduta, o incollata con spazi/a metà.")
              print("  Rifalla su console.anthropic.com e reincollala nel secret.")
              sys.exit(1)
          except anthropic.PermissionDeniedError:
              print("✗ Chiave valida ma senza permessi su questa risorsa (403).")
              sys.exit(1)
          except anthropic.APIStatusError as e:
              print(f"✗ L'API ha risposto {e.status_code}: la chiave non è la causa più probabile.")
              print("  Riprova fra poco; se persiste, guarda lo stato del servizio.")
              sys.exit(1)
          except anthropic.APIConnectionError as e:
              # La causa vera NON si ingoia: senza, il referto dice «rete» e si ferma lì.
              # È il difetto che ha reso muto il run #1 del 30/08.
              print("✗ Non sono riuscito a raggiungere l'API dal runner.")
              # Il testo dell'eccezione puo' CONTENERE il valore dell'intestazione,
              # cioe' la chiave: e' cosi' che il 30/08 e' finita nel log. Si stampa
              # il tipo, mai il messaggio.
              print(f"  Causa: {type(e).__name__}")
              if e.__cause__:
                  print(f"  Sotto: {type(e.__cause__).__name__} (messaggio omesso:")
                  print("         puo' contenere il valore della chiave)")
              print("  NON dice niente sulla chiave: guarda il passo 3 qui sopra —")
              print("  se anche api.github.com dà 000, il guasto è la rete del runner.")
              sys.exit(1)

          nomi = [m.id for m in modelli.data]
          print(f"✓ LA CHIAVE FUNZIONA. {len(nomi)} modelli raggiungibili.")
          print("")
          print("  L'automazione KIROSHI può girare. Il modello che usa oggi")
          print("  (scripts/kiroshi_check.py) è claude-sonnet-5.")
          atteso = "claude-sonnet-5"
          if atteso in nomi:
              print(f"  ✓ {atteso} è fra quelli disponibili.")
          else:
              print(f"  ⚠ {atteso} NON compare fra i modelli disponibili:")
              print("    l'automazione fallirebbe. Modelli visti:", ", ".join(nomi[:8]))
              sys.exit(1)
          PY

      - name: Esito
        if: success()
        run: echo "✓ Chiave presente, valida, e il modello dell'automazione è raggiungibile."
